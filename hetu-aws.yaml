AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hetu — read-only AWS IAM permission modeller, deployed into the customer's own AWS
  account. An App Runner service, an RDS Postgres for saved policy drafts, and an instance
  role scoped to reading policy configuration and nothing else.

  In-tenant is forced by the data, not chosen for taste: service control policies live in
  the organisation's management account, and no customer grants a SaaS vendor cross-account
  Organizations read. Without SCPs, "can this principal do that" is wrong in exactly the
  cases that matter.

  App Runner rather than ECS+ALB deliberately, matching Arjun: it provides a managed HTTPS
  endpoint with no certificate or domain of your own, and Cognito will not accept a plain
  HTTP callback URL. That single constraint decides the compute choice.

Parameters:
  ContainerImage:
    Type: String
    Description: >
      Image URI. App Runner pulls only from ECR or ECR Public - not GHCR - so this is either a
      public.ecr.aws URI or an image mirrored into this account's ECR.
  ImageRepositoryType:
    Type: String
    Default: ECR_PUBLIC
    AllowedValues: [ECR, ECR_PUBLIC]
    Description: Where the image lives. ECR_PUBLIC needs no access role.
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Postgres administrator password.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  NamePrefix:
    Type: String
    Default: hetu

Conditions:
  PrivateEcr: !Equals [!Ref ImageRepositoryType, ECR]

Resources:

  # ---- Networking -----------------------------------------------------------------
  # The database is not publicly reachable; App Runner reaches it through a VPC connector.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.43.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub '${NamePrefix}-vpc' }]

  # SubnetA/SubnetB are private: they hold the database and the App Runner VPC connector.
  # App Runner routes ALL of the service's outbound traffic through this VPC, so these subnets
  # need a path to the internet — otherwise the app cannot reach Cognito's public OIDC endpoint
  # at startup and the health check fails. That egress is via the NAT gateway below.
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  # A public subnet to host the NAT gateway (a NAT gateway must live in a subnet with a direct
  # route to an internet gateway). Nothing else runs here.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${NamePrefix}-igw' }]
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  # A single NAT gateway gives the private subnets outbound internet without making anything in
  # them reachable from outside. One NAT (not one per AZ) keeps cost down; cross-AZ egress is a
  # negligible data charge for this workload.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags: [{ Key: Name, Value: !Sub '${NamePrefix}-nat' }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref SubnetA
  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref SubnetB

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Hetu database subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hetu App Runner VPC connector
      VpcId: !Ref Vpc

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hetu database - reachable only from the app
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup

  # ---- Database -------------------------------------------------------------------
  # Saved policy drafts live here — the operator's own work, which Hetu cannot regenerate.
  # Everything else it shows is derived from the account plus the catalog baked into the image.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${NamePrefix}-db'
      Engine: postgres
      EngineVersion: '16.9'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      DBName: hetu
      MasterUsername: hetuadmin
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!GetAtt DbSecurityGroup.GroupId]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      MultiAZ: false

  # ---- Sign-in (Cognito, an OIDC provider) ----------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${NamePrefix}-users'
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # operators are invited, not self-registered

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub '${NamePrefix}-${AWS::AccountId}'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: hetu
      GenerateSecret: true               # Hetu is a confidential client
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, profile, email]
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders: [COGNITO]
      # The callback cannot be known until App Runner exists; install-aws.sh sets it afterwards.
      CallbackURLs: ['https://localhost/login/oauth2/code/oidc']

  # ---- Read-only access to model ---------------------------------------------------
  # Deliberately NOT the AWS-managed ReadOnlyAccess. Hetu reads authorization
  # configuration — identities, their policies, the organisation's SCPs and RCPs, and the
  # resource policies that grant access from outside an account. It has no business reading
  # data, so the grants below stop at policy documents.
  #
  # Two exclusions are the point of writing this by hand rather than reaching for a managed
  # policy: secretsmanager:GetResourcePolicy is granted but GetSecretValue is not, and
  # s3:GetBucketPolicy is granted but GetObject is not. Hetu can tell you who could read
  # a secret; it cannot read the secret.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: hetu-read-authorization-config
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Identities and their policies. GetAccountAuthorizationDetails is the bulk
              # read the collector is built around.
              - Sid: ReadIamConfiguration
                Effect: Allow
                Action:
                  - iam:Get*
                  - iam:List*
                  - iam:SimulateCustomPolicy
                  - iam:SimulatePrincipalPolicy
                Resource: '*'
              # The organisation ceilings — the reason this cannot be a SaaS.
              - Sid: ReadOrganizationPolicies
                Effect: Allow
                Action:
                  - organizations:Describe*
                  - organizations:List*
                Resource: '*'
              # AWS's own findings, so Hetu can reconcile against them rather than
              # pretend it is the only opinion in the account.
              - Sid: ReadAccessAnalyzer
                Effect: Allow
                Action:
                  - access-analyzer:Get*
                  - access-analyzer:List*
                Resource: '*'
              # Resource-based policies. Every one of these is a *Policy or *Attributes
              # read; none of them returns the contents of the resource.
              - Sid: ReadResourcePolicies
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetAccountPublicAccessBlock
                  - s3:ListAllMyBuckets
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                  - kms:ListAliases
                  - kms:ListKeys
                  - sqs:GetQueueAttributes
                  - sqs:ListQueues
                  - sns:GetTopicAttributes
                  - sns:ListTopics
                  - lambda:GetPolicy
                  - lambda:ListFunctions
                  - ecr:DescribeRepositories
                  - ecr:GetRepositoryPolicy
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecrets
                  - sts:GetCallerIdentity
                Resource: '*'

  AccessRole:
    Type: AWS::IAM::Role
    Condition: PrivateEcr
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  VpcConnector:
    Type: AWS::AppRunner::VpcConnector
    Properties:
      VpcConnectorName: !Sub '${NamePrefix}-connector'
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!GetAtt AppSecurityGroup.GroupId]

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub '${NamePrefix}-app'
      SourceConfiguration:
        # A private-ECR pull needs an access role; ECR Public does not.
        AuthenticationConfiguration:
          AccessRoleArn: !If [PrivateEcr, !GetAtt AccessRole.Arn, !Ref 'AWS::NoValue']
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ContainerImage
          ImageRepositoryType: !Ref ImageRepositoryType
          ImageConfiguration:
            Port: '8080'
            RuntimeEnvironmentVariables:
              - { Name: HETU_DB_URL, Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:5432/hetu' }
              - { Name: HETU_DB_USER, Value: hetuadmin }
              - { Name: HETU_DB_PASSWORD, Value: !Ref DbPassword }
              - { Name: HETU_OIDC_ISSUER, Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}' }
              - { Name: HETU_OIDC_CLIENT_ID, Value: !Ref UserPoolClient }
              # The Cognito app client is confidential (GenerateSecret: true), so the server-side
              # authorization-code→token exchange must authenticate with the client secret.
              - { Name: HETU_OIDC_CLIENT_SECRET, Value: !GetAtt UserPoolClient.ClientSecret }
              - { Name: AWS_REGION, Value: !Ref 'AWS::Region' }
      InstanceConfiguration:
        Cpu: 1 vCPU
        Memory: 2 GB
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !GetAtt VpcConnector.VpcConnectorArn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /actuator/health
        Interval: 20
        Timeout: 5

Outputs:
  AppUrl:
    Description: Hetu URL
    Value: !Sub 'https://${Service.ServiceUrl}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub 'https://${NamePrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
